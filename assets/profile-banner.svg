<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Mobina Haghshenas — kinetic data banner</title>
<desc id="desc">Bright editorial cream and aqua banner with large kinetic typography, bold animated gradient waves, rotating geometric rings, and an animated data pulse.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f6fff9"/><stop offset=".52" stop-color="#e4fbf7"/><stop offset="1" stop-color="#d8f2ff"/></linearGradient>
 <linearGradient id="wave" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00bfa6"/><stop offset=".48" stop-color="#31c7ed"/><stop offset="1" stop-color="#7b61ff"/></linearGradient>
 <linearGradient id="wave2"><stop stop-color="#8af3d2"/><stop offset=".5" stop-color="#31c7ed"/><stop offset="1" stop-color="#00bfa6"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#0c8c92" flood-opacity=".15"/></filter>
 <clipPath id="clip"><rect width="1200" height="340" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="340" fill="url(#paper)"/>
 <!-- oversized kinetic color forms -->
 <path d="M735 -90C850 -5 865 66 1000 44S1170 -20 1250 45L1250 250C1130 207 1060 294 942 260S795 188 735 235Z" fill="url(#wave)" opacity=".95">
  <animate attributeName="d" dur="8s" repeatCount="indefinite" values="M735 -90C850 -5 865 66 1000 44S1170 -20 1250 45L1250 250C1130 207 1060 294 942 260S795 188 735 235Z;M710 -65C835 42 900 12 1010 70S1150 18 1250 18L1250 275C1125 220 1065 252 950 282S795 145 710 255Z;M735 -90C850 -5 865 66 1000 44S1170 -20 1250 45L1250 250C1130 207 1060 294 942 260S795 188 735 235Z"/>
 </path>
 <path d="M800 340C900 220 980 300 1050 220S1150 145 1225 180L1225 340Z" fill="#b8fff0" opacity=".45">
  <animate attributeName="d" dur="6.5s" repeatCount="indefinite" values="M800 340C900 220 980 300 1050 220S1150 145 1225 180L1225 340Z;M770 340C900 250 960 255 1060 250S1140 185 1225 135L1225 340Z;M800 340C900 220 980 300 1050 220S1150 145 1225 180L1225 340Z"/>
 </path>
 <!-- bright moving ribbon -->
 <path d="M700 270C820 120 900 315 1030 170S1150 125 1230 85" fill="none" stroke="#e9fff8" stroke-width="4" stroke-linecap="round" opacity=".85" stroke-dasharray="18 14">
  <animate attributeName="stroke-dashoffset" from="0" to="-128" dur="3s" repeatCount="indefinite"/>
 </path>
 <!-- bold orbiting rings -->
 <g transform="translate(1000 160)" fill="none">
  <circle r="83" stroke="#ffffff" stroke-opacity=".68" stroke-width="2" stroke-dasharray="28 11">
   <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
  </circle>
  <ellipse rx="125" ry="45" transform="rotate(-32)" stroke="#f2fffb" stroke-width="2.5" stroke-opacity=".85">
   <animateTransform attributeName="transform" type="rotate" from="-32" to="328" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <circle r="14" fill="#f7fffc" stroke="none"><animate attributeName="r" values="11;17;11" dur="1.7s" repeatCount="indefinite"/></circle>
  <circle r="5" fill="#00bfa6" stroke="none"/>
 </g>
 <!-- orbiting dot -->
 <circle r="9" fill="#fff"><animateMotion dur="4.8s" repeatCount="indefinite" path="M1000 77 A83 83 0 1 1 999.9 77"/></circle>
 <!-- typography -->
 <g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="66" y="46" width="226" height="28" rx="14" fill="#ffffff" stroke="#bcece4"/>
  <circle cx="83" cy="60" r="4" fill="#00b99f"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="96" y="64" font-size="10" font-weight="700" letter-spacing="2" fill="#197d78">DATA · AI · OPTIMIZATION</text>
  <text x="62" y="145" font-size="49" font-weight="800" letter-spacing="-1.5" fill="#103b4b">MOBINA</text>
  <text x="62" y="200" font-size="49" font-weight="800" letter-spacing="-1.6" fill="#103b4b">HAGHSHENAS<tspan fill="#00bfa6">.</tspan></text>
  <rect x="66" y="222" width="3" height="34" rx="1.5" fill="#00bfa6"/>
  <text x="82" y="237" font-size="16" font-weight="600" fill="#326273">Turning complex data into</text>
  <text x="82" y="257" font-size="16" font-weight="600" fill="#326273">clearer decisions and smarter systems.</text>
  <g font-size="10" font-weight="700" letter-spacing="1.4" fill="#247c7a"><text x="67" y="300">HEALTHCARE AI</text><circle cx="174" cy="296" r="2" fill="#00bfa6"/><text x="188" y="300">ANALYTICS</text><circle cx="272" cy="296" r="2" fill="#00bfa6"/><text x="286" y="300">SYSTEMS THINKING</text></g>
 </g>
 <!-- moving tiny glints -->
 <g fill="#fff"><circle cx="858" cy="77" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="1134" cy="240" r="4"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle><circle cx="1090" cy="62" r="2.5"><animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/></circle></g>
 <rect x=".75" y=".75" width="1198.5" height="338.5" rx="22" fill="none" stroke="#b2e8e0" stroke-width="1.5"/>
</g></svg>