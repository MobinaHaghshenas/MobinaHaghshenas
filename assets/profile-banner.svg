<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Mobina Haghshenas — Business Analytics, AI and Optimization</title>
<desc id="desc">A light lavender business-analysis banner with an animated chart, connected data points, and a simplified illustration of people working with analytics.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset="1" stop-color="#eeeaff"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9585ef"/><stop offset="1" stop-color="#6d5bd0"/></linearGradient>
 <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75dbc3"/><stop offset="1" stop-color="#39b99f"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#6758a8" flood-opacity=".13"/></filter>
 <clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="360" fill="url(#bg)"/>
 <circle cx="160" cy="40" r="175" fill="#dcd5ff" opacity=".34"/>
 <circle cx="530" cy="330" r="210" fill="#d6f5ed" opacity=".45"/>
 <path d="M0 300C160 266 260 328 405 292S640 260 770 305 1035 327 1200 274V360H0Z" fill="#e4defb" opacity=".55"/>
 <g stroke="#b9b0eb" stroke-opacity=".22" stroke-width="1">
  <path d="M35 45H580M35 85H580M35 125H580M35 165H580M35 205H580M35 245H580M35 285H580"/>
  <path d="M55 25V320M95 25V320M135 25V320M175 25V320M215 25V320M255 25V320M295 25V320M335 25V320M375 25V320M415 25V320M455 25V320M495 25V320M535 25V320"/>
 </g>
 <!-- Analytics board -->
 <g filter="url(#shadow)" transform="translate(54 45)">
  <rect width="350" height="245" rx="18" fill="#fff" stroke="#d9d2f5"/>
  <rect x="0" y="0" width="350" height="42" rx="18" fill="#f4f1ff"/>
  <path d="M0 24V42H350V24" fill="#f4f1ff"/>
  <circle cx="20" cy="21" r="4" fill="#f3a5b6"/><circle cx="34" cy="21" r="4" fill="#f6ca7e"/><circle cx="48" cy="21" r="4" fill="#70d5bd"/>
  <text x="20" y="68" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4" fill="#9288b7">BUSINESS INSIGHTS</text>
  <text x="20" y="97" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#38305f">Data to decisions</text>
  <rect x="20" y="112" width="310" height="1" fill="#ece8fa"/>
  <g stroke="#e7e2f5" stroke-width="1"><path d="M22 151H328M22 183H328M22 215H328"/></g>
  <path d="M24 213 C55 205 60 180 91 188 S132 155 163 173 S211 138 239 150 S288 113 326 124 L326 226 L24 226Z" fill="#8c7ae8" opacity=".12"/>
  <path d="M24 213 C55 205 60 180 91 188 S132 155 163 173 S211 138 239 150 S288 113 326 124" fill="none" stroke="#7968d8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="430" stroke-dashoffset="430">
   <animate attributeName="stroke-dashoffset" from="430" to="0" dur="3.4s" repeatCount="indefinite"/>
  </path>
  <circle r="5" fill="#42bea4" stroke="#fff" stroke-width="2">
   <animateMotion dur="3.4s" repeatCount="indefinite" path="M24 213 C55 205 60 180 91 188 S132 155 163 173 S211 138 239 150 S288 113 326 124"/>
  </circle>
  <text x="22" y="237" font-family="Arial,sans-serif" font-size="9" fill="#a29abf">ANALYZE  ·  LEARN  ·  OPTIMIZE</text>
 </g>
 <!-- Floating metrics card -->
 <g filter="url(#shadow)" transform="translate(337 170)">
  <rect width="196" height="124" rx="16" fill="#fff" stroke="#d9d2f5"/>
  <text x="16" y="24" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#9b91be">MODEL PERFORMANCE</text>
  <text x="16" y="54" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#453a78">94.8<tspan font-size="13" fill="#3bb99e">%</tspan></text>
  <text x="16" y="70" font-family="Arial,sans-serif" font-size="9" fill="#9a93b4">validation score</text>
  <g transform="translate(17 83)">
   <rect x="0" y="12" width="13" height="17" rx="3" fill="#b8adf5"><animate attributeName="height" values="17;25;17" dur="2.8s" repeatCount="indefinite"/><animate attributeName="y" values="12;4;12" dur="2.8s" repeatCount="indefinite"/></rect>
   <rect x="22" y="6" width="13" height="23" rx="3" fill="#9787ec"><animate attributeName="height" values="23;15;23" dur="2.5s" repeatCount="indefinite"/><animate attributeName="y" values="6;14;6" dur="2.5s" repeatCount="indefinite"/></rect>
   <rect x="44" y="0" width="13" height="29" rx="3" fill="#58cbb0"><animate attributeName="height" values="29;23;29" dur="3s" repeatCount="indefinite"/><animate attributeName="y" values="0;6;0" dur="3s" repeatCount="indefinite"/></rect>
   <rect x="66" y="9" width="13" height="20" rx="3" fill="#f0a7ba"><animate attributeName="height" values="20;28;20" dur="2.6s" repeatCount="indefinite"/><animate attributeName="y" values="9;1;9" dur="2.6s" repeatCount="indefinite"/></rect>
  </g>
 </g>
 <!-- Connected data nodes -->
 <g fill="none" stroke="#a99de7" stroke-width="1.5" stroke-opacity=".7">
  <path d="M445 77L490 57L530 83L562 47L585 74"/>
  <path d="M490 57L500 110L545 125L562 47M500 110L445 77M545 125L585 74"/>
 </g>
 <g>
  <circle cx="445" cy="77" r="5" fill="#53c9ae"/><circle cx="490" cy="57" r="5" fill="#8d7ce6"/><circle cx="530" cy="83" r="6" fill="#ef9eb5"/><circle cx="562" cy="47" r="5" fill="#53c9ae"/><circle cx="585" cy="74" r="4" fill="#8d7ce6"/><circle cx="500" cy="110" r="4" fill="#8d7ce6"/><circle cx="545" cy="125" r="5" fill="#53c9ae"/>
  <circle cx="530" cy="83" r="10" fill="none" stroke="#ef9eb5" stroke-width="1.5"><animate attributeName="r" values="8;17;8" dur="3s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".8;0;.8" dur="3s" repeatCount="indefinite"/></circle>
 </g>
 <!-- Simplified business-analysis illustration: people, board and idea bulb -->
 <g filter="url(#shadow)">
  <rect x="585" y="61" width="74" height="112" rx="10" fill="#fff" stroke="#ded8f4"/>
  <rect x="597" y="75" width="50" height="4" rx="2" fill="#d8d0f5"/>
  <rect x="597" y="86" width="34" height="4" rx="2" fill="#e7e2f7"/>
  <path d="M598 145L609 129L620 136L633 112L647 120" fill="none" stroke="#7968d8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="100" stroke-dashoffset="100"><animate attributeName="stroke-dashoffset" values="100;0;0" dur="4s" repeatCount="indefinite"/></path>
  <circle cx="647" cy="120" r="3.5" fill="#4ec5a8"><animate attributeName="r" values="3;5;3" dur="1.8s" repeatCount="indefinite"/></circle>
  <rect x="609" y="150" width="28" height="5" rx="2.5" fill="#c6bdf0"/>
 </g>
 <!-- Decorative orbiting data dots -->
 <g fill="#5bcbb0">
  <circle cx="75" cy="25" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="550" cy="310" r="3"><animate attributeName="cy" values="310;299;310" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="610" cy="214" r="2.5"><animate attributeName="cx" values="610;622;610" dur="2.2s" repeatCount="indefinite"/></circle>
 </g>
 <path d="M657 180C690 196 691 215 715 222" fill="none" stroke="#9d91e6" stroke-width="1.5" stroke-dasharray="4 7" stroke-opacity=".65"><animate attributeName="stroke-dashoffset" from="0" to="-22" dur="2s" repeatCount="indefinite"/></path>
 <!-- Name and focus -->
 <g font-family="Arial,sans-serif">
  <text x="704" y="113" font-size="13" font-weight="700" letter-spacing="3" fill="#8a7bd3">INDUSTRIAL ENGINEER</text>
  <text x="700" y="166" font-size="43" font-weight="800" letter-spacing="-1.4" fill="#39315f">MOBINA</text>
  <text x="700" y="213" font-size="43" font-weight="800" letter-spacing="-1.4" fill="#39315f">HAGHSHENAS</text>
  <text x="704" y="247" font-size="15" fill="#746b9c">Turning data into meaningful decisions.</text>
  <path d="M704 269H1138" stroke="#cfc7ee" stroke-width="1.5"/>
  <g font-size="10" font-weight="700" letter-spacing="1.1">
   <text x="704" y="294" fill="#6554c8">MACHINE LEARNING</text>
   <circle cx="850" cy="290" r="2.5" fill="#ef9eb5"/>
   <text x="864" y="294" fill="#319f8a">HEALTHCARE AI</text>
   <circle cx="984" cy="290" r="2.5" fill="#ef9eb5"/>
   <text x="998" y="294" fill="#a077b7">OPTIMIZATION</text>
  </g>
  <text x="704" y="320" font-family="monospace" font-size="10" letter-spacing=".5" fill="#a29abf">MODEL  /  EXPLAIN  /  IMPROVE</text>
 </g>
 <rect x=".75" y=".75" width="1198.5" height="358.5" rx="23" fill="none" stroke="#d5cef0" stroke-width="1.5"/>
</g>
</svg>
