<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Mobina Haghshenas — data science and healthcare AI</title>
<desc id="desc">Minimal light editorial banner featuring an animated machine-learning decision surface, flowing data streams, a pulsing medical-imaging scan, and integrated animated typing-style introduction.</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfffd"/><stop offset=".55" stop-color="#eafaf7"/><stop offset="1" stop-color="#e9f4ff"/></linearGradient>
 <linearGradient id="ink"><stop stop-color="#0b5964"/><stop offset="1" stop-color="#173b55"/></linearGradient>
 <linearGradient id="signal"><stop stop-color="#00b99f"/><stop offset=".52" stop-color="#2fbce7"/><stop offset="1" stop-color="#7773f5"/></linearGradient>
 <linearGradient id="scan"><stop stop-color="#00b99f" stop-opacity="0"/><stop offset=".5" stop-color="#00b99f" stop-opacity=".95"/><stop offset="1" stop-color="#00b99f" stop-opacity="0"/></linearGradient>
 <clipPath id="clip"><rect width="1200" height="390" rx="22"/></clipPath>
 <filter id="soft"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="390" fill="url(#paper)"/>
 <!-- Minimal data landscape: decision boundaries instead of decorative orbit -->
 <path d="M720 0H1200V390H830C790 318 855 275 820 217S735 129 720 0Z" fill="#d9f8f0" opacity=".7"/>
 <path d="M790 0C860 78 826 128 900 181S1010 255 955 390" fill="none" stroke="#a7e9dc" stroke-width="1.5"/>
 <path d="M830 0C900 76 866 130 940 184S1050 260 995 390" fill="none" stroke="#a7e9dc" stroke-width="1.5"/>
 <path d="M870 0C940 74 906 132 980 186S1090 265 1035 390" fill="none" stroke="#a7e9dc" stroke-width="1.5"/>
 <!-- Optimization path over a contour map -->
 <g fill="none" stroke="#8acfc9" stroke-width="1.2" opacity=".65">
  <path d="M780 40C880 50 880 110 960 105S1070 60 1150 90"/>
  <path d="M760 80C860 90 880 150 960 145S1080 100 1170 130"/>
  <path d="M790 120C870 130 900 190 980 185S1090 140 1190 170"/>
  <path d="M820 160C900 170 920 230 1000 225S1110 180 1200 210"/>
  <path d="M840 205C920 215 940 270 1020 265S1130 220 1200 250"/>
  <path d="M860 250C940 260 960 310 1040 305S1150 260 1200 290"/>
 </g>
 <!-- Machine-learning feature points -->
 <g fill="#29bfa8" opacity=".75">
  <circle cx="824" cy="74" r="3"/><circle cx="881" cy="112" r="3"/><circle cx="918" cy="73" r="4"/><circle cx="1008" cy="123" r="3"/><circle cx="1068" cy="84" r="3"/><circle cx="1120" cy="148" r="4"/><circle cx="859" cy="189" r="3"/><circle cx="945" cy="213" r="4"/><circle cx="1028" cy="181" r="3"/><circle cx="1092" cy="245" r="4"/><circle cx="1160" cy="212" r="3"/><circle cx="911" cy="295" r="3"/><circle cx="1002" cy="327" r="3"/><circle cx="1115" cy="310" r="3"/>
 </g>
 <!-- The learned decision path animates through observations -->
 <path d="M790 310C850 300 850 245 900 242S935 280 980 240 1030 150 1080 163 1110 105 1175 72" fill="none" stroke="#fff" stroke-width="10" opacity=".8" stroke-linecap="round"/>
 <path d="M790 310C850 300 850 245 900 242S935 280 980 240 1030 150 1080 163 1110 105 1175 72" fill="none" stroke="url(#signal)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="18 11">
  <animate attributeName="stroke-dashoffset" from="0" to="-145" dur="3.5s" repeatCount="indefinite"/>
 </path>
 <circle r="7" fill="#00b99f" stroke="#fff" stroke-width="3"><animateMotion dur="7s" repeatCount="indefinite" path="M790 310C850 300 850 245 900 242S935 280 980 240 1030 150 1080 163 1110 105 1175 72"/></circle>
 <!-- Medical imaging motif: framed scan, scanning bar -->
 <g transform="translate(1064 272)">
  <rect x="-54" y="-39" width="108" height="78" rx="8" fill="#f9fffd" fill-opacity=".72" stroke="#6acdbf" stroke-width="1.5"/>
  <circle r="24" fill="#bdeee5" opacity=".55"/>
  <ellipse rx="17" ry="23" fill="none" stroke="#36b8a7" stroke-width="1.5"/>
  <ellipse rx="9" ry="15" fill="none" stroke="#36b8a7" stroke-width="1.5"/>
  <path d="M-30 0H30M0 -29V29" stroke="#36b8a7" stroke-opacity=".55" stroke-width="1"/>
  <rect x="-42" y="-27" width="84" height="4" rx="2" fill="url(#scan)"><animate attributeName="y" values="-27;23;-27" dur="3s" repeatCount="indefinite"/></rect>
  <circle r="3" fill="#00b99f"><animate attributeName="r" values="2;5;2" dur="2s" repeatCount="indefinite"/></circle>
 </g>
 <!-- Typography and integrated typing-style sequence -->
 <g font-family="Inter,Segoe UI,Arial,sans-serif">
  <rect x="66" y="42" width="235" height="28" rx="14" fill="#fff" stroke="#b9e8df"/>
  <circle cx="83" cy="56" r="4" fill="#00b99f"><animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/></circle>
  <text x="97" y="60" font-size="10" font-weight="700" letter-spacing="1.8" fill="#287d78">DATA SCIENCE  /  HEALTHCARE AI</text>
  <text x="62" y="123" font-size="48" font-weight="800" letter-spacing="-1.5" fill="url(#ink)">MOBINA</text>
  <text x="62" y="175" font-size="48" font-weight="800" letter-spacing="-1.7" fill="url(#ink)">HAGHSHENAS<tspan fill="#00b99f">.</tspan></text>
  <text x="66" y="208" font-size="15" font-weight="600" fill="#426875">Data-driven thinking. Intelligent systems.</text>
  <text x="66" y="228" font-size="15" font-weight="600" fill="#426875">Better decisions.</text>
  <path d="M66 247H510" stroke="#b6e4de"/>
  <circle cx="70" cy="272" r="3" fill="#00b99f"/>
  <text x="83" y="277" font-size="13" font-family="JetBrains Mono,Consolas,monospace" fill="#197f7b"> <tspan>Turning data into decisions</tspan><animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;.22;.5;.78;1" dur="11.2s" repeatCount="indefinite"/></text>
  <text x="83" y="277" font-size="13" font-family="JetBrains Mono,Consolas,monospace" fill="#197f7b" opacity="0">Exploring AI that can be explained<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.22;.24;.48;1" dur="11.2s" repeatCount="indefinite"/></text>
  <text x="83" y="277" font-size="13" font-family="JetBrains Mono,Consolas,monospace" fill="#197f7b" opacity="0">Modeling complex systems &amp; optimizing them<animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.49;.51;.73;1" dur="11.2s" repeatCount="indefinite"/></text>
  <text x="83" y="277" font-size="13" font-family="JetBrains Mono,Consolas,monospace" fill="#197f7b" opacity="0">Interested in healthcare AI &amp; medical imaging<animate attributeName="opacity" values="0;0;1;0" keyTimes="0;.75;.77;1" dur="11.2s" repeatCount="indefinite"/></text>
  <rect x="83" y="287" width="3" height="17" rx="1.5" fill="#00b99f"><animate attributeName="x" values="83;270;83" dur="4s" repeatCount="indefinite"/></rect>
  <g font-size="10" font-weight="700" letter-spacing="1.5" fill="#287d78"><text x="66" y="330">HEALTHCARE AI</text><circle cx="178" cy="326" r="2" fill="#00b99f"/><text x="192" y="330">OPTIMIZATION</text><circle cx="306" cy="326" r="2" fill="#00b99f"/><text x="320" y="330">ANALYTICS</text></g>
 </g>
 <rect x=".75" y=".75" width="1198.5" height="388.5" rx="22" fill="none" stroke="#b8e7df" stroke-width="1.5"/>
</g></svg>