<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">About Mobina Haghshenas</title>
  <desc id="desc">Industrial Engineering graduate interested in data analytics, machine learning, optimization, simulation, explainable AI, healthcare, and medical imaging.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17172b" stop-opacity=".94"/>
      <stop offset=".72" stop-color="#17172b" stop-opacity=".80"/>
      <stop offset="1" stop-color="#17172b" stop-opacity=".48"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a89cff"/>
      <stop offset="1" stop-color="#70e0c3"/>
    </linearGradient>
  </defs>
  <image href="https://raw.githubusercontent.com/MobinaHaghshenas/MobinaHaghshenas/main/assets/web-471952966.webp" width="1200" height="520" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="520" rx="24" fill="url(#shade)"/>
  <rect x="58" y="58" width="7" height="404" rx="3.5" fill="url(#accent)"/>
  <text x="92" y="105" fill="#b9b0ff" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="3">ABOUT ME</text>
  <text x="92" y="157" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Industrial Engineering graduate</text>
  <text x="92" y="207" fill="#f2f1fa" font-family="Arial, Helvetica, sans-serif" font-size="21">I’m interested in using data and analytical methods to support</text>
  <text x="92" y="238" fill="#f2f1fa" font-family="Arial, Helvetica, sans-serif" font-size="21">better decisions—from finding patterns in datasets to modeling</text>
  <text x="92" y="269" fill="#f2f1fa" font-family="Arial, Helvetica, sans-serif" font-size="21">real-world systems and comparing possible solutions.</text>
  <text x="92" y="324" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Areas of interest</text>
  <text x="92" y="360" fill="#e2defe" font-family="Arial, Helvetica, sans-serif" font-size="19">Data analytics · Machine learning · Mathematical optimization</text>
  <text x="92" y="391" fill="#e2defe" font-family="Arial, Helvetica, sans-serif" font-size="19">Simulation · Explainable AI · Healthcare &amp; medical imaging</text>
  <text x="92" y="440" fill="#d8d6e8" font-family="Arial, Helvetica, sans-serif" font-size="17">I value clear problem formulation, thoughtful methods, and honest interpretation.</text>
