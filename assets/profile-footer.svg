<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
<title id="title">Thanks for visiting — Mobina Haghshenas</title>
<desc id="desc">A light lavender footer matching the profile header, with subtle animated data lines and a moving mint data point.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaff"/><stop offset="1" stop-color="#eeeaff"/></linearGradient>
  <linearGradient id="line"><stop stop-color="#9585ef" stop-opacity=".12"/><stop offset=".5" stop-color="#6d5bd0" stop-opacity=".7"/><stop offset="1" stop-color="#75dbc3" stop-opacity=".55"/></linearGradient>
  <clipPath id="clip"><rect width="1200" height="150" rx="22"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="1200" height="150" fill="url(#bg)"/>
  <circle cx="1100" cy="12" r="160" fill="#dcd5ff" opacity=".4"/>
  <circle cx="180" cy="155" r="130" fill="#d6f5ed" opacity=".55"/>
  <g stroke="#b9b0eb" stroke-opacity=".22" stroke-width="1">
    <path d="M0 30H1200M0 60H1200M0 90H1200M0 120H1200"/>
    <path d="M80 0V150M160 0V150M240 0V150M320 0V150M400 0V150M480 0V150M560 0V150M640 0V150M720 0V150M800 0V150M880 0V150M960 0V150M1040 0V150M1120 0V150"/>
  </g>
  <path d="M0 112C120 78 190 128 310 91S500 66 620 100 830 132 940 82 1090 65 1200 91" fill="none" stroke="url(#line)" stroke-width="2"/>
  <path d="M0 125C120 91 190 141 310 104S500 79 620 113 830 145 940 95 1090 78 1200 104" fill="none" stroke="#9585ef" stroke-opacity=".22" stroke-width="1"/>
  <circle r="4" fill="#39b99f"><animateMotion dur="9s" repeatCount="indefinite" path="M0 112C120 78 190 128 310 91S500 66 620 100 830 132 940 82 1090 65 1200 91"/></circle>
  <g font-family="Arial,sans-serif">
    <text x="54" y="62" font-size="22" font-weight="700" fill="#38305f">Thanks for stopping by<tspan fill="#6d5bd0">.</tspan></text>
    
  </g>
  <rect x=".75" y=".75" width="1198.5" height="148.5" rx="22" fill="none" stroke="#d9d2f5" stroke-width="1.5"/>
