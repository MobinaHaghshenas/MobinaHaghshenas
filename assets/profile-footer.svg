<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title desc">
<title id="title">Thank you — animated closing banner</title>
<desc id="desc">Minimal bright aqua closing banner with a sweeping animated gradient ribbon, moving sparkles and a single thank-you message.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9fff7"/><stop offset=".55" stop-color="#d9f7ff"/><stop offset="1" stop-color="#d9eaff"/></linearGradient>
 <linearGradient id="ribbon"><stop stop-color="#00bfa6"/><stop offset=".48" stop-color="#31c7ed"/><stop offset="1" stop-color="#7b61ff"/></linearGradient>
 <clipPath id="clip"><rect width="1200" height="150" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="150" fill="url(#bg)"/>
 <path d="M-80 125C160 10 260 195 470 88S760 20 900 91 1110 152 1280 32" fill="none" stroke="url(#ribbon)" stroke-width="20" stroke-linecap="round" opacity=".16">
  <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M-80 125C160 10 260 195 470 88S760 20 900 91 1110 152 1280 32;M-80 85C160 175 260 10 470 110S760 150 900 65 1110 20 1280 100;M-80 125C160 10 260 195 470 88S760 20 900 91 1110 152 1280 32"/>
 </path>
 <path d="M-50 142C170 45 280 170 480 88S760 45 930 103 1100 115 1250 54" fill="none" stroke="url(#ribbon)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="16 18">
  <animate attributeName="stroke-dashoffset" from="0" to="-170" dur="2.8s" repeatCount="indefinite"/>
 </path>
 <g fill="#00bfa6">
  <circle cx="115" cy="44" r="4"><animate attributeName="cy" values="44;34;44" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="1080" cy="39" r="5"><animate attributeName="cy" values="39;52;39" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="1015" cy="111" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="190" cy="110" r="3"><animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/></circle>
 </g>
 <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="87" font-size="36" font-weight="800" letter-spacing="1.5" fill="#103b4b">THANK YOU<tspan fill="#00bfa6">!</tspan><animate attributeName="opacity" values="1;.72;1" dur="3s" repeatCount="indefinite"/></text>
  <path d="M510 105H690" stroke="#00bfa6" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 180;180 0;0 180" dur="4s" repeatCount="indefinite"/></path>
 </g>
 <rect x=".75" y=".75" width="1198.5" height="148.5" rx="20" fill="none" stroke="#a8e5df" stroke-width="1.5"/>
</g></svg>