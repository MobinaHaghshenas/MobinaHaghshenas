<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="142" viewBox="0 0 1200 142" role="img" aria-labelledby="title desc">
<title id="title">Thank you — minimal animated data stream</title>
<desc id="desc">Clean pale mint closing banner with a dynamic flowing data line, moving particles, and a single thank-you message.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfffd"/><stop offset=".55" stop-color="#e8faf7"/><stop offset="1" stop-color="#e8f3ff"/></linearGradient>
 <linearGradient id="signal"><stop stop-color="#00b99f"/><stop offset=".55" stop-color="#32bce8"/><stop offset="1" stop-color="#7a73f5"/></linearGradient>
 <clipPath id="clip"><rect width="1200" height="142" rx="20"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1200" height="142" fill="url(#bg)"/>
 <path d="M-30 115C115 115 140 36 255 57S405 137 520 91 685 21 790 68 980 133 1230 25" fill="none" stroke="#b7eee4" stroke-width="18" stroke-linecap="round" opacity=".45">
  <animate attributeName="d" dur="7s" repeatCount="indefinite" values="M-30 115C115 115 140 36 255 57S405 137 520 91 685 21 790 68 980 133 1230 25;M-30 88C115 45 140 120 255 92S405 25 520 64 685 130 790 88 980 35 1230 70;M-30 115C115 115 140 36 255 57S405 137 520 91 685 21 790 68 980 133 1230 25"/>
 </path>
 <path d="M-30 115C115 115 140 36 255 57S405 137 520 91 685 21 790 68 980 133 1230 25" fill="none" stroke="url(#signal)" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="18 14">
  <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="2.6s" repeatCount="indefinite"/>
 </path>
 <circle r="6" fill="#fff" stroke="#00b99f" stroke-width="3"><animateMotion dur="6s" repeatCount="indefinite" path="M-30 115C115 115 140 36 255 57S405 137 520 91 685 21 790 68 980 133 1230 25"/></circle>
 <circle cx="110" cy="37" r="4" fill="#00b99f"><animate attributeName="cy" values="37;27;37" dur="2.2s" repeatCount="indefinite"/></circle>
 <circle cx="1085" cy="108" r="4" fill="#5d9fe8"><animate attributeName="cy" values="108;97;108" dur="2.5s" repeatCount="indefinite"/></circle>
 <g font-family="Inter,Segoe UI,Arial,sans-serif" text-anchor="middle">
  <text x="600" y="70" font-size="35" font-weight="800" letter-spacing="1.6" fill="#174754">THANK YOU<tspan fill="#00b99f">.</tspan><animate attributeName="opacity" values="1;.78;1" dur="3s" repeatCount="indefinite"/></text>
  <path d="M530 88H670" stroke="url(#signal)" stroke-width="3.5" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="0 140;140 0;0 140" dur="4s" repeatCount="indefinite"/></path>
 </g>
 <rect x=".75" y=".75" width="1198.5" height="140.5" rx="20" fill="none" stroke="#b8e7df" stroke-width="1.5"/>
</g></svg>